<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="panel">
    <aside class="rail">
      <div class="rail-top">
        <div class="orb" id="orb"><div class="orb-core"></div></div>
        <div class="status" id="status">EN ESPERA</div>
      </div>
      <div class="readouts">
        <div class="readout"><span class="k">MODELO</span><span class="v" id="modelName">—</span></div>
        <div class="readout"><span class="k">MODO</span><span class="v" id="modeName">TEXTO</span></div>
        <div class="readout"><span class="k">HORA</span><span class="v" id="clock">--:--</span></div>
      </div>
      <div class="rail-bottom">
        <button class="mode-toggle" id="modeToggle">Activar voz</button>
      </div>
    </aside>

    <main class="chat">
      <div class="thread" id="thread">
        <div class="msg model">
          <div class="msg-label">JARVIS</div>
          <div class="msg-text">Sistemas en línea. ¿En qué trabajamos?</div>
        </div>
      </div>

      <form class="composer" id="composer">
        <button type="button" class="mic-btn" id="micBtn" title="Hablar">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-2.08A7 7 0 0019 12h-2z"/></svg>
        </button>
        <input type="text" id="input" placeholder="Escribe un mensaje…" autocomplete="off" />
        <button type="submit" class="send-btn">Enviar</button>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
