<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud">
    <div class="corner-readouts">
      <span id="modelName">—</span>
      <span id="clock">--:--</span>
    </div>

    <main class="stage">
      <canvas id="orbCanvas" width="480" height="480"></canvas>

      <div class="status" id="status">EN ESPERA</div>
      <div class="caption" id="caption"></div>

      <div class="controls">
        <button class="talk-btn" id="talkBtn">
          <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-2.08A7 7 0 0019 12h-2z"/></svg>
          <span id="talkBtnLabel">Toca para hablar</span>
        </button>
        <button class="chat-toggle" id="chatToggle">Chat de texto</button>
      </div>
    </main>

    <aside class="drawer" id="drawer">
      <div class="drawer-header">
        <span>TRANSCRIPCIÓN</span>
        <button class="drawer-close" id="drawerClose">✕</button>
      </div>
      <div class="thread" id="thread"></div>
      <form class="composer" id="composer">
        <input type="text" id="input" placeholder="Escribe un mensaje…" autocomplete="off" />
        <button type="submit" class="send-btn">Enviar</button>
      </form>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
